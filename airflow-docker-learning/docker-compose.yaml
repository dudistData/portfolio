version: '3.8'

# This file defines the different "services" (containers) that make up our Airflow application.
# For local learning, we will use Postgres as the database and the LocalExecutor to run tasks.

# x-airflow-common is an "anchor". It allows us to define settings once and reuse them in multiple services below.
x-airflow-common:
  &airflow-common
  # We use our custom Dockerfile to build the image instead of downloading a pre-built one.
  build: .
  # This tells Airflow to use the variables defined in our .env file.
  env_file:
    - .env
  environment:
    # Use Postgres for the backend metadata database
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    # Use the LocalExecutor, which is perfect for local testing and runs tasks within the scheduler container.
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    # Turn off loading example DAGs to keep the UI clean
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    # Set the default timezone
    AIRFLOW__CORE__DEFAULT_TIMEZONE: 'UTC'
  # Mount our local folders into the containers so changes sync immediately without rebuilding the image
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./data:/opt/airflow/data
  # The webserver and scheduler both depend on the database being up and running
  depends_on:
    postgres:
      condition: service_healthy

services:
  # The Postgres Database. Airflow uses this to store its state (like which tasks ran, when, and if they succeeded).
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      # Store the database files in a Docker volume so data isn't lost when the container stops
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  # The Airflow Scheduler. This is the "brain" of Airflow. It reads the DAGs, figures out what needs to run, and triggers tasks.
  # Since we are using LocalExecutor, the tasks actually execute inside this container.
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  # The Airflow Webserver. This provides the user interface (UI) that you view in your browser.
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      # Map your computer's port 8080 to the container's port 8080
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  # The Initialization service. This only runs once when you first start everything up.
  # It sets up the database tables and creates the default admin user.
  airflow-init:
    <<: *airflow-common
    command: version
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DEFAULT_TIMEZONE: 'UTC'
      _AIRFLOW_DB_UPGRADE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
    depends_on:
      postgres:
        condition: service_healthy

# Volumes allow Docker to persist data across container restarts
volumes:
  postgres-db-volume:
